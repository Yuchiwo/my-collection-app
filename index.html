<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Collection Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Outfit:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=26">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW registered!', reg);
                }).catch(err => console.log('SW init failed', err));
            });
        }
    </script>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1><span class="highlight">My</span> Collection <span
                    style="font-size: 0.5em; opacity: 0.5; vertical-align: middle;">v1.2</span></h1>

            <!-- Auth Controls -->
            <div id="authContainer" class="auth-container">
                <div id="userProfile" style="display: none; align-items: center; gap: 8px;">
                    <img id="userAvatar" src=""
                        style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--accent-color);">
                    <span id="userName" style="font-size: 0.9rem; font-weight: 600;"></span>
                </div>
                <button id="loginBtn" class="action-btn-small" style="background: white; color: var(--bg-color);">
                    <span class="material-icons-round" style="font-size: 16px;">login</span> ログイン
                </button>
                <button id="logoutBtn" class="action-btn-small hidden" style="background: rgba(255,255,255,0.1);">
                    <span class="material-icons-round" style="font-size: 16px;">logout</span>
                </button>
            </div>

            <p class="subtitle">お気に入りの瞬間やアイテムを、自由にコレクション。</p>

            <div class="controls-bar">
                <select id="sortSelect">
                    <option value="custom">✦ 自由に並び替え</option>
                    <option value="rating-desc">★ 評価が高い順</option>
                    <option value="rating-asc">★ 評価が低い順</option>
                    <option value="date-desc">🕒 日付が新しい順</option>
                    <option value="date-asc">🕒 日付が古い順</option>
                </select>

                <div class="slider-container" title="カードのサイズを変更">
                    <span class="material-icons-round" style="font-size: 1.2rem; opacity: 0.7;">grid_view</span>
                    <input type="range" id="cardSizeSlider" min="80" max="400" step="10" value="280">
                </div>

                <div class="action-buttons">
                    <button id="syncBtn" class="icon-btn hidden" title="クラウドに同期（アップロード）">
                        <span class="material-icons-round">cloud_upload</span>
                    </button>
                    <button id="backupBtn" class="icon-btn" title="データを保存 (バックアップ)">
                        <span class="material-icons-round">download</span>
                    </button>
                    <button id="restoreBtn" class="icon-btn" title="データを読み込む (復元)">
                        <span class="material-icons-round">upload</span>
                    </button>
                    <input type="file" id="restoreInput" accept=".json" style="display: none;">
                </div>
            </div>
            <!-- Filter Bar injected here -->
            <div id="filterBar" class="filter-bar">
                <!-- Filter buttons will be injected here -->
            </div>
        </header>

        <main class="board-container" id="board">
            <!-- Items will be injected here via JS -->
            <div class="empty-state" id="emptyState">
                <span class="material-icons-round empty-icon">dashboard_customize</span>
                <p>まだコレクションがありません。<br>右下のボタンから追加してみましょう！</p>
            </div>
        </main>

        <button class="fab" id="addBtn" aria-label="新しいアイテムを追加">
            <span class="material-icons-round">add</span>
        </button>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay hidden" id="itemModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>新規コレクション</h2>
                <button class="close-btn" id="closeModalBtn">
                    <span class="material-icons-round">close</span>
                </button>
            </div>
            <form id="addForm">
                <!-- Tabs -->
                <div class="input-tabs">
                    <button type="button" class="tab-btn active" data-tab="file">画像</button>
                    <button type="button" class="tab-btn" data-tab="link">URL</button>
                </div>

                <!-- Tab: Image File -->
                <div class="tab-content active" id="tab-file">
                    <div class="form-group image-upload-group">
                        <label for="imageInput" class="image-upload-label" id="imagePreviewContainer">
                            <span class="material-icons-round">add_photo_alternate</span>
                            <span>画像を選択</span>
                            <img id="imagePreview" class="hidden" alt="Preview">
                        </label>
                        <input type="file" id="imageInput" accept="image/*"
                            style="opacity: 0; position: absolute; inset: 0; cursor: pointer;">
                    </div>
                </div>

                <!-- Tab: Link -->
                <div class="tab-content" id="tab-link">
                    <div class="form-group link-input-group" style="display: flex; gap: 8px;">
                        <input type="url" id="linkInput" placeholder="https://example.com" autocomplete="off"
                            style="flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white;">
                        <button type="button" id="fetchLinkBtn" class="action-btn-small"
                            style="padding: 0 16px; background: var(--accent-color); border: none; border-radius: 12px; color: white; cursor: pointer;">取得</button>
                    </div>
                    <div id="linkPreviewStatus" class="status-msg"
                        style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; min-height: 20px;">
                    </div>
                </div>

                <div class="form-group">
                    <label>タグ</label>
                    <div id="modalTagContainer" class="tag-input-container">
                        <!-- Chip Input will be rendered here -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="memoInput">ひとことメモ / タイトル</label>
                    <input type="text" id="memoInput" placeholder="思い出やコメント..." maxlength="50">
                </div>

                <div class="form-group">
                    <label>評価</label>
                    <div class="star-rating-input" id="starInput">
                        <input type="radio" name="rating" id="star5" value="5"><label for="star5">★</label>
                        <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
                        <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
                        <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
                        <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">
                        <span>ボードに貼る</span>
                        <span class="material-icons-round">check</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Image Lightbox -->
    <div class="lightbox-overlay hidden" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">
            <span class="material-icons-round">close</span>
        </button>
        <img id="lightboxImage" src="" alt="Full size preview">
    </div>

    <script type="module" src="script.js?v=52"></script>
</body>

</html>
